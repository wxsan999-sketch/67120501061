<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>Blogger</title>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
	<script src='main.js'></script>
</head>
<body>
	<div class="forum-container">

		<nav class="top-nav">
			<a href="../../index.html">&larr; Back to Portfolio</a>
		</nav>

		<h1 id="top"></h1>

		<div class="post-box">
			<span class="post-label">Topic</span>
			<div id="topic" class="post-content"></div>
		</div>

		<div class="post-box">
			<span class="post-label">Reply 1</span>
			<div id="reply1" class="post-content"></div>
		</div>

		<div class="post-box">
			<span class="post-label">Reply 2</span>
			<div id="reply2" class="post-content"></div>
		</div>

		<div class="compose">
			<textarea name="message" id="message" placeholder="Type your message here..."></textarea>
			<div class="button-group">
				<button type="button" id="postBtn">Post</button>
				<button type="button" id="clearBtn">Clear</button>
			</div>
		</div>

	</div>
</body>
</html>
