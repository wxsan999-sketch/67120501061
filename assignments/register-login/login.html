<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<link rel="stylesheet" href="style.css">
		<script type="text/javascript" src="login.js"></script>
	</head>
	<body>
		<nav class="top-nav">
			<a href="../../index.html">&larr; Back to Portfolio</a>
		</nav>

		<form name="myLogin" id="myLogin" class="login-form">
			<fieldset>
				<legend>Login</legend>

				<div class="field">
					<label for="username">Username</label>
					<input type="text" name="username" id="username" required>
				</div>

				<div class="field">
					<label for="loginPassword">Password</label>
					<input type="password" name="password" id="loginPassword" required>
				</div>

				<div class="button-group">
					<input type="submit" value="Login" id="loginBtn">
					<input type="reset" value="Clear" id="clearBtn">
				</div>

				<p class="switch-link">Don't have an account? <a href="register.html">Register</a></p>
			</fieldset>
		</form>
	</body>
</html>
